<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">GPT Switch</title>
  <desc id="desc">Codex connection, sign-in and thread synchronization for Windows and SSH hosts, with preview, backup and verification.</desc>
