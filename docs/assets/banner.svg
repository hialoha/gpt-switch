  <text x="51" y="177" fill="#b9cbdf" font-family="Segoe UI,Arial,sans-serif" font-size="20">Keep local and remote Codex connections in sync.</text>
  <text x="51" y="230" fill="#83dcca" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">PREVIEW  /  BACKUP  /  SYNC  /  VERIFY</text>
